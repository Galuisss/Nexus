[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-codex"
version = "0.1.0"
description = "A self-hosted control plane for Codex sessions across machines"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "openai-codex==0.169.0",
  "httpx[socks]>=0.28,<1",
  "mcp>=2.3,<3",
  "websockets==17.4",
  "pywebpush>=2.1,<3",
  "python-multipart>=0.0.20,<1",
  "zstandard>=0.23,<1",
  "tiktoken>=0.12,<1",
  "psutil>=7,<8",
]

[project.optional-dependencies]
dev = ["playwright>=1.50", "ruff==0.17.5"]

[project.scripts]
nexus = "nexus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = [".nexus", ".nexus-demo"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

