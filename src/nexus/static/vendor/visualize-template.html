<style>
:root {
  color-scheme: light dark;
  --color-background-primary: light-dark(#ffffff, #202124);
  --color-background-secondary: light-dark(#f4f5f6, #292b30);
  --color-text-primary: light-dark(#25272b, #e9ebef);
  --color-text-secondary: light-dark(#656a74, #a9aeb9);
  --color-text-inverse: #fff;
  --color-text-info: light-dark(#235fc7, #8ab4ff);
  --color-text-warning: light-dark(#986000, #e9bc60);
  --color-background-info: light-dark(#edf3ff, #283851);
  --color-border-primary: light-dark(#d9dde3, #454951);
  --color-border-secondary: light-dark(#e9ecf0, #363940);
  --color-ring-primary: light-dark(#2864cf, #91b9ff);
  --background: var(--color-background-primary);
  --foreground: var(--color-text-primary);
  --muted: var(--color-background-secondary);
  --muted-foreground: var(--color-text-secondary);
  --card: var(--background);
  --card-foreground: var(--foreground);
  --popover: var(--background);
  --popover-foreground: var(--foreground);
  --primary: var(--color-text-info);
  --primary-foreground: light-dark(#fff, #182843);
  --secondary: var(--muted);
  --secondary-foreground: var(--foreground);
  --accent: var(--color-background-info);
  --accent-foreground: var(--primary);
  --border: var(--color-border-secondary);
  --border-strong: var(--color-border-primary);
  --input: var(--border-strong);
  --ring: var(--color-ring-primary);
  --blue: light-dark(#326ac6, #8ab4ff);
  --green: light-dark(#23805b, #77c7a3);
  --red: light-dark(#bf4049, #f18d96);
  --orange: light-dark(#b56722, #eaaa74);
  --purple: light-dark(#8053bf, #bda0ef);
  --yellow: light-dark(#9b790d, #dbc267);
  --destructive: var(--red);
  --viz-series-1: var(--blue);
  --viz-series-2: var(--orange);
  --viz-series-3: var(--green);
  --viz-series-4: var(--purple);
  --viz-series-5: var(--red);
  --viz-series-6: var(--yellow);
  --viz-bg: var(--background);
  --viz-panel: var(--card);
  --viz-text: var(--foreground);
  --viz-muted: var(--muted-foreground);
  --viz-border: var(--border);
  --viz-accent: var(--primary);
  --viz-accent-text: var(--primary-foreground);
  --viz-accent-bg: var(--accent);
  --viz-warning: var(--color-text-warning);
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  --font-size-base: 14px;
  --font-size-normal: 14px;
  --font-size-small: 12px;
  --font-size-tooltip: 12px;
  --font-text-md-size: 14px;
  --font-size-h1: 26px;
  --font-size-h2: 21px;
  --font-size-h3: 17px;
  --font-weight-normal: 400;
  --font-weight-medium: 600;
  --line-height-normal: 1.55;
  --line-height-small: 1.45;
  --line-height-tooltip: 1.45;
  --viz-font-size: var(--font-size-base);
  --radius: 10px;
  --radius-sm: 4px;
  --radius-md: 7px;
  --radius-lg: 10px;
  --radius-2xl: 18px;
  --radius-full: 999px;
  --border-radius-lg: var(--radius-lg);
  --shadow-sm: 0 2px 8px #0000000c;
  --icon-size: 16px;
  --control-spacing: 8px;
  --btn-size: 36px;
  --corner-shape: round;
  --form-range-track: var(--muted);
  --visualize-paint-gutter: 4px;
  --cursor-interaction: pointer;
  font: var(--font-weight-normal) var(--font-size-base)/var(--line-height-normal) var(--font-sans);
  color: var(--foreground);
  background: var(--background);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; padding: 8px 2px; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
h1, h2, h3, p, ul, ol, figure, pre { margin: 0 0 16px; }
h1, h2, h3 { line-height: 1.3; font-weight: 600; text-wrap: balance; }
h1 { font-size: var(--font-size-h1); }
h2 { font-size: var(--font-size-h2); }
h3 { font-size: var(--font-size-h3); }
p:last-child, ul:last-child, ol:last-child, figure:last-child, pre:last-child { margin-bottom: 0; }
a { color: var(--primary); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button, select, summary, .cursor-interaction { cursor: var(--cursor-interaction); }
button:disabled, input:disabled, select:disabled, textarea:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
img, video, canvas, svg { max-width: 100%; }
img, video { height: auto; }
pre, code, kbd { font-family: var(--font-mono); }
pre { overflow: auto; padding: 16px; border-radius: var(--radius-md); background: var(--muted); }
hr { margin: 20px 0; border: 0; border-top: 1px solid var(--border); }
.card, .widget { padding: 20px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); color: var(--card-foreground); }
.is-selected { outline: 2px solid var(--primary); outline-offset: -2px; }
.viz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px; }
.viz-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.viz-stat { display: flex; flex-direction: column; gap: 8px; }
.viz-stat-value { font-size: 30px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.viz-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: var(--radius-full); background: var(--accent); color: var(--accent-foreground); font-size: var(--font-size-small); }
.viz-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 16px; }
.viz-controls > .form-label { flex: 1 1 160px; }
.form-label { display: flex; flex-direction: column; gap: 8px; margin: 0; font-weight: 500; }
.form-control, .form-select { width: 100%; min-width: 0; min-height: 36px; padding: 7px 10px; border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--background); }
textarea.form-control { resize: vertical; min-height: 88px; }
.form-control::placeholder { color: var(--muted-foreground); }
.form-control-color { width: 48px; height: 36px; padding: 3px; }
.form-range { width: 100%; min-width: 0; height: 36px; margin: 0; accent-color: var(--primary); }
.form-check { display: flex; align-items: center; gap: 9px; min-height: 36px; }
.form-check-input { width: 17px; height: 17px; margin: 0; flex: none; accent-color: var(--primary); }
.form-check-label { cursor: var(--cursor-interaction); }
.form-switch .form-check-input { appearance: none; width: 36px; height: 22px; border: 1px solid var(--input); border-radius: 999px; background: var(--muted); padding: 3px; }
.form-switch .form-check-input::before { content: ""; display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--muted-foreground); }
.form-switch .form-check-input:checked { background: var(--primary); border-color: var(--primary); }
.form-switch .form-check-input:checked::before { margin-left: 14px; background: var(--primary-foreground); }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 36px; padding: 7px 13px; border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--background); font-weight: 500; line-height: 1.4; text-decoration: none; }
.btn:hover { background: var(--muted); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover { background: color-mix(in srgb, var(--primary) 88%, var(--foreground)); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-sm { min-height: 30px; padding: 4px 9px; font-size: var(--font-size-small); }
.btn-block { display: flex; width: 100%; }
.viz-tile { display: flex; flex-direction: column; align-items: start; text-align: left; padding: 16px; }
.table-responsive { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; text-align: left; }
.table th, .table td { padding: 11px 12px; border-bottom: 1px solid var(--border); }
.table th { font-weight: 600; color: var(--muted-foreground); }
.table tbody tr:last-child td { border-bottom: 0; }
.progress { display: flex; height: 8px; overflow: hidden; border-radius: var(--radius-full); background: var(--muted); }
.progress-bar { height: 100%; background: var(--primary); }
.nav { display: flex; align-items: center; gap: 4px; padding: 0; list-style: none; overflow-x: auto; }
.nav-link { display: block; flex: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px; border-radius: 0; background: transparent; color: var(--muted-foreground); text-decoration: none; white-space: nowrap; }
.nav-link.active, .nav-link[aria-selected="true"] { color: var(--foreground); border-bottom-color: var(--primary); }
.nav-pills { padding: 4px; border-radius: var(--radius-lg); background: var(--muted); }
.nav-pills .nav-link { border: 0; border-radius: var(--radius-md); }
.nav-pills .nav-link.active, .nav-pills .nav-link[aria-selected="true"] { background: var(--background); box-shadow: var(--shadow-sm); }
.nav-justified > * { flex: 1; text-align: center; }
.viz-dotted-background { background-image: radial-gradient(var(--border-strong) .8px, transparent .8px); background-size: 18px 18px; }
.text-muted { color: var(--muted-foreground); }
.text-small { font-size: var(--font-size-small); }
.text-warning { color: var(--color-text-warning); }
.text-destructive { color: var(--destructive); }
.text-center { text-align: center; }
.text-end { text-align: end; }
.text-nowrap { white-space: nowrap; }
.tabular-nums { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
[data-lucide], .lucide { width: var(--icon-size); height: var(--icon-size); vertical-align: middle; flex: none; }
.viz-carousel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.viz-carousel > [data-variant] { grid-area: 1 / 1; min-width: 0; }
.viz-carousel > [data-variant][hidden] { display: block !important; visibility: hidden; }
.viz-carousel-controls { display: flex; justify-content: center; align-items: center; gap: 10px; min-width: 0; grid-row: 2; }
.viz-carousel-picker { width: auto; max-width: min(320px, 65%); }
.viz-carousel-count { flex: none; font-variant-numeric: tabular-nums; color: var(--muted-foreground); }
.tooltip { position: fixed; z-index: 1000; width: max-content; max-width: min(320px, calc(100vw - 16px)); padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--popover); color: var(--popover-foreground); box-shadow: 0 3px 14px #0002; font-size: var(--font-size-tooltip); line-height: var(--line-height-tooltip); pointer-events: none; overflow-wrap: anywhere; }
@media (pointer: coarse) {
  .btn, .form-control, .form-select, .form-check, .nav-link { min-height: 44px; }
  .form-range { height: 44px; }
}
@media (max-width: 480px) {
  .card, .widget { padding: 16px; }
  .viz-grid { gap: 12px; }
  .viz-controls { gap: 12px; }
  .viz-carousel-controls { gap: 8px; }
}
</style>
<!--__NEXUS_VISUALIZATION_ICONS__-->
<!--__INLINE_VISUALIZATION_FRAGMENT__-->
<script>
(() => {
  const icons = () => globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  if (globalThis.lucide) icons();
  else {
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/lucide@1.17.0/dist/umd/lucide.min.js';
    script.onload = icons;
    document.head.append(script);
  }

  function activateTab(tab) {
    const group = tab.closest('[role="tablist"]');
    for (const item of group.querySelectorAll('[role="tab"]')) {
      const selected = item === tab;
      item.setAttribute('aria-selected', String(selected));
      item.tabIndex = selected ? 0 : -1;
      item.classList.toggle('active', selected);
      const id = item.getAttribute('aria-controls') || item.getAttribute('href')?.replace(/^#/, '');
      const panel = id && document.getElementById(id);
      if (panel) panel.hidden = !selected;
    }
  }

  function initialize(root) {
    for (const group of root.querySelectorAll('[role="tablist"]:not([data-nexus-tabs])')) {
      group.dataset.nexusTabs = '';
      const tabs = [...group.querySelectorAll('[role="tab"]')];
      const enabled = () => tabs.filter(tab => !tab.disabled && tab.getAttribute('aria-disabled') !== 'true');
      const selected = tabs.find(tab => tab.getAttribute('aria-selected') === 'true' || tab.classList.contains('active')) || enabled()[0];
      if (selected) activateTab(selected);
      group.addEventListener('click', event => {
        const tab = event.target.closest('[role="tab"]');
        if (enabled().includes(tab)) { event.preventDefault(); activateTab(tab); }
      });
      group.addEventListener('keydown', event => {
        const items = enabled();
        const current = items.indexOf(event.target);
        const movement = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[event.key];
        let next;
        if (event.key === 'Home') next = items[0];
        else if (event.key === 'End') next = items.at(-1);
        else if (movement && current >= 0) next = items[(current + movement + items.length) % items.length];
        if (next) { event.preventDefault(); activateTab(next); next.focus(); }
      });
    }
    for (const carousel of root.querySelectorAll('.viz-carousel:not([data-nexus-carousel])')) {
      const panels = [...carousel.children].filter(panel => panel.hasAttribute('data-variant'));
      if (!panels.length) continue;
      carousel.dataset.nexusCarousel = '';
      let active = Math.max(0, panels.findIndex(panel => !panel.hidden));
      const controls = document.createElement('div');
      controls.className = 'viz-carousel-controls';
      const picker = document.createElement('select');
      picker.className = 'form-select viz-carousel-picker';
      picker.setAttribute('aria-label', '选择方案');
      panels.forEach((panel, index) => picker.add(new Option(panel.dataset.variant || `方案 ${index + 1}`, String(index))));
      const count = document.createElement('span');
      count.className = 'viz-carousel-count';
      count.setAttribute('aria-live', 'polite');
      const select = index => {
        active = (index + panels.length) % panels.length;
        panels.forEach((panel, i) => { panel.hidden = i !== active; panel.inert = i !== active; });
        picker.value = String(active);
        count.textContent = `${active + 1} / ${panels.length}`;
      };
      const arrow = (label, direction, name) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `btn btn-ghost viz-carousel-${name}`;
        button.setAttribute('aria-label', label);
        button.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="${direction}"/></svg>`;
        button.onclick = () => select(active + (name === 'previous' ? -1 : 1));
        return button;
      };
      picker.onchange = () => select(Number(picker.value));
      if (panels.length > 1) {
        controls.append(arrow('上一个方案', 'm10 3-5 5 5 5', 'previous'), picker, count, arrow('下一个方案', 'm6 3 5 5-5 5', 'next'));
        carousel.append(controls);
      }
      select(active);
    }
  }
  initialize(document);
  new MutationObserver(records => {
    if (records.some(record => [...record.addedNodes].some(node => node instanceof HTMLElement))) {
      initialize(document);
      if (document.querySelector('[data-lucide]:not(svg)')) icons();
    }
  }).observe(document.body, { childList: true, subtree: true });

  const tooltip = document.createElement('div');
  tooltip.id = 'nexus-visualization-tooltip';
  tooltip.className = 'tooltip';
  tooltip.role = 'tooltip';
  tooltip.hidden = true;
  document.body.append(tooltip);
  let trigger, describedBy;
  const hide = () => {
    if (trigger) {
      if (describedBy) trigger.setAttribute('aria-describedby', describedBy);
      else trigger.removeAttribute('aria-describedby');
    }
    trigger = null;
    tooltip.hidden = true;
  };
  const show = event => {
    const next = event.composedPath().find(node => node instanceof Element && node.hasAttribute('data-tooltip'));
    if (next === trigger) return;
    hide();
    if (!next?.getAttribute('data-tooltip')) return;
    trigger = next;
    describedBy = trigger.getAttribute('aria-describedby');
    trigger.setAttribute('aria-describedby', [describedBy, tooltip.id].filter(Boolean).join(' '));
    tooltip.textContent = trigger.getAttribute('data-tooltip');
    tooltip.hidden = false;
    const anchor = trigger.getBoundingClientRect(), box = tooltip.getBoundingClientRect();
    const placement = trigger.getAttribute('data-tooltip-placement') || 'top';
    let x = anchor.left + (anchor.width - box.width) / 2;
    let y = placement.startsWith('bottom') ? anchor.bottom + 8 : anchor.top - box.height - 8;
    if (placement.startsWith('left') || placement.startsWith('right')) {
      x = placement.startsWith('left') ? anchor.left - box.width - 8 : anchor.right + 8;
      y = anchor.top + (anchor.height - box.height) / 2;
    } else if (y < 8) y = anchor.bottom + 8;
    else if (y + box.height > innerHeight - 8) y = anchor.top - box.height - 8;
    tooltip.style.left = `${Math.max(8, Math.min(x, innerWidth - box.width - 8))}px`;
    tooltip.style.top = `${Math.max(8, Math.min(y, innerHeight - box.height - 8))}px`;
  };
  document.addEventListener('pointerover', show);
  document.addEventListener('focusin', show);
  document.addEventListener('pointerout', event => {
    if (trigger && !trigger.contains(event.relatedTarget)) hide();
  });
  document.addEventListener('focusout', hide);
  document.addEventListener('keydown', event => { if (event.key === 'Escape') hide(); });
  window.addEventListener('scroll', hide, true);
  window.addEventListener('resize', hide);
})();
</script>
