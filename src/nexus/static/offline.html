<!doctype html>
<html lang="zh-CN">
<head>
  <script>document.documentElement.dataset.languagePending = '';</script>
  <style>html[data-language-pending] body { visibility: hidden; }</style>
  <script type="module" src="/static/i18n.js?v=145"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <title data-i18n="Nexus · 离线">Nexus · 离线</title>
  <link rel="icon" href="/static/favicon.svg?v=145" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; font: 14px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color: #292927; background: #f7f7f4; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
    main { text-align: center; padding: 32px; }
    img { width: 56px; height: 56px; }
    h1 { margin: 18px 0 24px; font-size: 20px; font-weight: 500; }
    button { font: inherit; color: #fff; background: #2d2d29; border: 0; padding: 9px 20px; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    @media (prefers-color-scheme: dark) { :root { color: #e9e9e1; background: #21211f; } button { color: #242421; background: #deded3; } }
  </style>
</head>
<body>
  <main><img src="/static/favicon.svg?v=145" alt=""><h1 data-i18n="当前离线">当前离线</h1><button id="reconnect" type="button" data-i18n="重新连接">重新连接</button></main>
  <script>
    const button = document.getElementById('reconnect');
    let reconnecting = false;

    async function reconnect() {
      if (reconnecting) return;
      reconnecting = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch('/api/config', { cache: 'no-store', signal: controller.signal });
        if (response.ok) location.reload();
      } catch { /* Keep the offline page ready for another attempt. */ }
      finally {
        clearTimeout(timeout);
        reconnecting = false;
      }
    }

    button.addEventListener('click', reconnect);
    window.addEventListener('online', reconnect);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reconnect(); });
    setInterval(reconnect, 10000);
  </script>
</body>
</html>
